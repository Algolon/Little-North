name: Fox R01a Blender character study
on:
  push:
    branches: [art/ln-fox-r01a-character-study]
    paths: ['tools/fox-r01a/**', '.github/workflows/fox-r01a-study.yml']
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender 4.2
        run: |
          curl --fail --location --retry 2 https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
      - name: Build, render and roundtrip GLB
        run: /tmp/blender-4.2.0-linux-x64/blender -b -t 2 --python tools/fox-r01a/build_fox.py
      - name: Compose neutral review sheet
        run: |
          python3 -m pip -q install Pillow
          python3 tools/fox-r01a/contact_sheet.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LN-FOX-R01a-character-study
          path: artifacts/fox-r01a/
          retention-days: 30
      - name: Preserve generated study on isolated branch
        run: |
          git config user.name "Little North Art Pipeline"
          git config user.email "107330279+Algolon@users.noreply.github.com"
          git add artifacts/fox-r01a/
          git commit -m "art(fox-r01a): preserve actual Blender source, GLB and neutral render evidence" || test -z "$(git status --porcelain artifacts/fox-r01a/)"
          git push origin HEAD:art/ln-fox-r01a-character-study
