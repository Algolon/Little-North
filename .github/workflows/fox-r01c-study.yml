name: Fox R01c new whole-character sculpt
on:
  push:
    branches: [art/ln-fox-r01a-character-study]
    paths: ['tools/fox-r01c/**', '.github/workflows/fox-r01c-study.yml']
permissions:
  contents: write
jobs:
  model:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install volume tools and Blender
        run: |
          python3 -m pip -q install numpy scikit-image
          curl --fail --location --retry 2 https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
      - name: Model new continuous whole-character volume
        run: python3 tools/fox-r01c/build_volume.py
      - name: Preserve Blender source and render whole character
        run: /tmp/blender-4.2.0-linux-x64/blender -b -t 2 --python tools/fox-r01c/render_fox.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LN-FOX-R01c-whole-character
          path: artifacts/fox-r01c/
          retention-days: 30
      - name: Preserve isolated fox source and evidence
        run: |
          git config user.name "Little North Art Pipeline"
          git config user.email "107330279+Algolon@users.noreply.github.com"
          git add artifacts/fox-r01c/
          git commit -m "art(fox-r01c): preserve new full fox sculpt, Blender source and real render evidence" || test -z "$(git status --porcelain artifacts/fox-r01c/)"
          git push origin HEAD:art/ln-fox-r01a-character-study
